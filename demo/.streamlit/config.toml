# Paleta índigo de la demo en versión clara y oscura. El tema activo se elige desde la propia página
# (Sistema, Claro u Oscuro); «Sistema» sigue la preferencia del sistema operativo.
[theme.light]
primaryColor = "#5b4a9b"
backgroundColor = "#f7f7f9"
secondaryBackgroundColor = "#ebe9f3"
textColor = "#1c1838"

[theme.dark]
primaryColor = "#a99be0"
backgroundColor = "#14121c"
secondaryBackgroundColor = "#211e2e"
textColor = "#ecebf4"

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
